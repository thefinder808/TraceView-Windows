[workspace]
resolver = "2"
members = ["crates/engine", "crates/traceview", "crates/d2d-probe", "crates/tv-ui", "crates/tv-render", "crates/tv-platform", "crates/tv-errors"]
exclude = ["fuzz"]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
