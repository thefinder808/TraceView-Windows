name: Fuzz

# Coverage-guided fuzzing runs on Linux because libFuzzer doesn't link with the
# MSVC toolchain. The parsing logic it exercises isn't platform-specific.
on:
  push:
    paths:
      - "crates/engine/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_row, open_file]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz for five minutes
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
