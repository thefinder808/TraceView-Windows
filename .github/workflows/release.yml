name: Release

# Pushing a tag like v0.9.0 tests and builds TraceView for x64 and ARM64,
# signs both EXEs with Azure Artifact Signing, and creates a draft GitHub
# release, which is published by hand after checking it. How to set up the
# signing side is in docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    # Has no access to signing, so nothing that runs during the build, such as
    # a crate's build script, can reach it. No cache either, so a release is
    # built only from the tag and crates.io.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add the ARM64 target
        run: rustup target add aarch64-pc-windows-msvc
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: pwsh -File scripts/build-release.ps1 -BuildOnly -Tag $env:TAG
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: windows-latest
    # The environment holds the signing settings, and should only let v* tags
    # deploy to it.
    environment: release
    permissions:
      contents: write # create the draft release
      id-token: write # sign in to Azure with OpenID Connect, with no stored secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: dist
      - name: Check that signing is set up
        # A release is never made unsigned.
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          $missing = 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'TRUSTED_SIGNING_ENDPOINT',
            'TRUSTED_SIGNING_ACCOUNT', 'TRUSTED_SIGNING_PROFILE' |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) { throw "The release environment is missing: $($missing -join ', ')" }
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign the EXEs
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\dist\x64\traceview.exe
            ${{ github.workspace }}\dist\arm64\traceview.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: TraceView
          # Only the Azure sign-in above, so nothing else is tried first.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Check the signatures and package
        env:
          TAG: ${{ github.ref_name }}
        run: pwsh -File scripts/build-release.ps1 -PackageOnly -RequireSigned -Tag $env:TAG
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $version = $env:TAG.TrimStart('v')
          # Only these are downloads. The notes come from CHANGELOG.md.
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Extension -eq '.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object FullName)
          # A full release, even before 1.0, so it shows on the repository's front
          # page as the latest. Pre-releases are left out there. The README and
          # the notes say TraceView is a beta.
          $options = @('--draft', '--verify-tag', '--notes-file', 'dist/release-notes.md', '--title', "TraceView $version")
          gh release create $env:TAG @files @options --repo $env:REPO
          if ($LASTEXITCODE -ne 0) { throw 'Creating the draft release failed' }
