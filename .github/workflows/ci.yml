name: CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Third-party notices are up to date
        run: pwsh -File scripts/third-party-notices.ps1 -Check

  deny:
    # Fails on a crate with a known vulnerability, a license that isn't
    # allowed, or a crate from anywhere but crates.io. The rules are in deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  arm64:
    # Cross-compiles for ARM64 Windows. The build machine can't run the EXE,
    # so it's kept as an artifact for testing on an ARM64 PC.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the ARM64 target
        run: rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target aarch64-pc-windows-msvc -p traceview
      - uses: actions/upload-artifact@v4
        with:
          name: traceview-arm64
          path: target/aarch64-pc-windows-msvc/release/traceview.exe
          retention-days: 14
