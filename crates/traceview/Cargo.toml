[package]
name = "traceview"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Adds hidden options that drive the GUI through scripted performance checks.
bench = []

[dependencies]
accesskit = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tv-engine = { path = "../engine" }
tv-platform = { path = "../tv-platform" }
tv-render = { path = "../tv-render" }
tv-ui = { path = "../tv-ui" }

[dev-dependencies]
png = "0.18"
tempfile = "3"

[build-dependencies]
embed-manifest = "1.5.1"
